<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CuriousKids Leo">
  <!-- Maskable-safe: full-bleed background, lion content within central 80% safe zone -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Lion mane -->
  <g transform="translate(256 262)">
    <g fill="#F6A623">
      <circle cx="0" cy="-118" r="34"/>
      <circle cx="83" cy="-83" r="34"/>
      <circle cx="118" cy="0" r="34"/>
      <circle cx="83" cy="83" r="34"/>
      <circle cx="0" cy="118" r="34"/>
      <circle cx="-83" cy="83" r="34"/>
      <circle cx="-118" cy="0" r="34"/>
      <circle cx="-83" cy="-83" r="34"/>
    </g>
    <!-- Face -->
    <circle cx="0" cy="0" r="108" fill="#FCD9A0"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="#F6A623" stroke-width="6"/>
    <!-- Ears -->
    <circle cx="-78" cy="-78" r="26" fill="#F6A623"/>
    <circle cx="78" cy="-78" r="26" fill="#F6A623"/>
    <circle cx="-78" cy="-78" r="13" fill="#FCD9A0"/>
    <circle cx="78" cy="-78" r="13" fill="#FCD9A0"/>
    <!-- Eyes -->
    <circle cx="-40" cy="-14" r="15" fill="#3A2A1A"/>
    <circle cx="40" cy="-14" r="15" fill="#3A2A1A"/>
    <circle cx="-35" cy="-19" r="5" fill="#fff"/>
    <circle cx="45" cy="-19" r="5" fill="#fff"/>
    <!-- Muzzle -->
    <ellipse cx="0" cy="44" rx="52" ry="40" fill="#FFF1DC"/>
    <path d="M0 28 l16 16 a16 16 0 0 1 -32 0 z" fill="#C8765A"/>
    <path d="M0 44 v22" stroke="#3A2A1A" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 66 q-18 14 -34 4" fill="none" stroke="#3A2A1A" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 66 q18 14 34 4" fill="none" stroke="#3A2A1A" stroke-width="5" stroke-linecap="round"/>
    <!-- Whiskers -->
    <g stroke="#3A2A1A" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M-50 40 h-44"/>
      <path d="M-50 54 h-40"/>
      <path d="M50 40 h44"/>
      <path d="M50 54 h40"/>
    </g>
  </g>
</svg>
